      { id: 'art-2', title: 'Bagaimana Menolak Victim Blaming di Sekitarmu', category: 'Campaign & Advocacy', readTime: '5 Menit', likes: 236 },

    const CASE_SIMULATIONS = [
      {
        id: 'sim-1',
        situation: 'Teman sekamarmu tiba-tiba sering mengurung diri dan menangis setelah pulang dari kegiatan organisasi, namun dia berkata "Aku gapapa, cuma capek". Apa respon empati terbaikmu?',

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [assessmentAnswers, setAssessmentAnswers] = useState({});
      const [assessmentRisk, setAssessmentRisk] = useState(null);
      const [simScore, setSimScore] = useState(null);
      const [selectedSimOption, setSelectedSimOption] = useState(null);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'system', text: 'Selamat datang di Ruang Aman EIRA! Saya adalah asisten AI pendampingmu. Ceritakan apa yang sedang kamu rasakan tanpa takut dihakimi.' }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [peerChatMessages, setPeerChatMessages] = useState([
        { sender: 'peer', text: 'Halo! Aku Sobat Sebaya-mu hari ini. Silakan ceritakan apa saja, identitasmu aman di sini bersama tim AEGIS.' }
      ]);
      const [peerInput, setPeerInput] = useState('');
      const [selectedPeer, setSelectedPeer] = useState(null);
      const [isAnonymous, setIsAnonymous] = useState(true);
      const [isChattingWithPeer, setIsChattingWithPeer] = useState(false);
      const [bookingDate, setBookingDate] = useState('');
      const [bookingTime, setBookingTime] = useState('');
      const [isBooked, setIsBooked] = useState(false);
      const [communityPosts, setCommunityPosts] = useState([
        { id: 'post-1', author: 'Anonim - Angkatan 22', content: 'Terima kasih AEGIS, akhirnya aku berani cerita setelah setahun memendam rasa cemas akibat dipojokkan rekan kerja organisasi.', likes: 45, time: '2 jam yang lalu' },
        { id: 'post-2', author: 'Anonim - Angkatan 23', content: 'Rasanya lega sekali saat Sobat Sebaya memvalidasi perasaanku dan tidak bilang kalau aku "baperan". Kalian hebat!', likes: 62, time: '5 jam yang lalu' }
      ]);
      const [newPostText, setNewPostText] = useState('');
      const [dailyMood, setDailyMood] = useState(null);
      const [assessmentFinished, setAssessmentFinished] = useState(false);
      const [customNotification, setCustomNotification] = useState(null);

      const triggerNotification = (type, title, message) => {
        setCustomNotification({ type, title, message });
      };

      const handleSendEira = () => {
        if (!inputValue.trim()) return;
        const userMsg = { sender: 'user', text: inputValue };
        setChatMessages(prev => [...prev, userMsg]);
        const currentInput = inputValue;
        setInputValue('');

        setTimeout(() => {
          let botReply = '';
          const text = currentInput.toLowerCase();
          if (text.includes('sedih') || text.includes('cemas') || text.includes('takut') || text.includes('stres')) {
            botReply = 'Perasaan sedih, cemas, atau tertekan yang kamu rasakan sepenuhnya valid. Kamu tidak sendirian di sini. Bersediakah kamu mengisi menu "Layanan DETECT" di atas untuk membantu memetakan tingkat kecemasanmu saat ini secara ilmiah?';
          } else if (text.includes('victim blaming') || text.includes('salah') || text.includes('dituduh')) {
            botReply = 'Ingatlah selalu, kekerasan psikis atau perlakuan tidak adil yang terjadi bukanlah kesalahan batinmu. Perilaku menyalahkan korban (*victim blaming*) adalah fokus edukasi kami agar lingkungan kampus lebih berempati.';
          } else if (text.includes('eira') || text.includes('nama')) {
            botReply = 'Halo! Aku EIRA (Edukatif, Inspiratif, Responsif, Aman), asisten virtual pendamping ruang amanmu. Aku di sini untuk membimbingmu kapan pun kamu membutuhkan kawan bicara.';
          } else {
            botReply = 'Terima kasih telah berbagi cerita denganku. Di AEGIS, kami berkomitmen menjaga kerahasiaanmu 100%. Jika kamu membutuhkan teman diskusi manusia yang responsif, kamu bisa bergeser ke menu "Ruang SUPPORT" untuk mengobrol dengan Sobat Sebaya pilihanmu.';
          }
          setChatMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        }, 900);
      };

      const handleSendPeer = () => {
        if (!peerInput.trim()) return;
        const userMsg = { sender: 'user', text: peerInput };
        setPeerChatMessages(prev => [...prev, userMsg]);
        setPeerInput('');

        setTimeout(() => {
          setPeerChatMessages(prev => [...prev, { 
            sender: 'peer', 
            text: 'Terima kasih sudah mau berbagi denganku. Ceritamu sepenuhnya aman dan terenkripsi di sistem AEGIS. Aku siap terus mendengarkanmu.' 
          }]);
        }, 1100);
      };

      const handleAssessmentAnswer = (questionId, score) => {
        setAssessmentAnswers(prev => ({ ...prev, [questionId]: score }));
      };

      const calculateRisk = () => {
        const totalQuestions = 5;
        const answeredCount = Object.keys(assessmentAnswers).length;
        if (answeredCount < totalQuestions) {
          triggerNotification(
            'warning', 
            'Asesmen Belum Lengkap', 
            'Mohon selesaikan kelima pertanyaan asesmen terlebih dahulu agar kami dapat mendeteksi tingkat risiko Anda dengan akurat.'
          );
          return;
        }

        const totalScore = Object.values(assessmentAnswers).reduce((a, b) => a + b, 0);
        let risk = 'Rendah';
        if (totalScore >= 11) risk = 'Tinggi';
        else if (totalScore >= 6) risk = 'Sedang';

        setAssessmentRisk(risk);
        setAssessmentFinished(true);
        triggerNotification(
          'success',
          'Asesmen Berhasil',
          `Identifikasi selesai. Kondisi psikis Anda tergolong dalam tingkat risiko: ${risk.toUpperCase()}. Silakan periksa rekomendasi pendampingan di sisi kanan.`
        );
      };

      const resetAssessment = () => {
        setAssessmentAnswers({});
        setAssessmentRisk(null);
        setAssessmentFinished(false);
      };

      const handleAddPost = () => {
        if (!newPostText.trim()) return;
        const newPost = {
          id: `post-${Date.now()}`,
          author: 'Anonim - Angkatan Baru',
          content: newPostText,
          likes: 0,
          time: 'Baru saja'
        };
        setCommunityPosts([newPost, ...communityPosts]);
        setNewPostText('');
        triggerNotification(
          'success',
          'Pesan Terkirim',
          'Terima kasih telah berbagi! Pesan anonim Anda berhasil diterbitkan ke komunitas setelah melewati sistem moderasi otomatis AEGIS.'
        );
      };

      const handleBooking = () => {
        if (!selectedPeer || !bookingDate || !bookingTime) {
          triggerNotification(
            'error',
            'Data Pertemuan Kurang',
            'Silakan tentukan Sobat Sebaya pilihan Anda serta lengkapi isian tanggal dan jam pertemuan.'
          );
          return;
        }
        setIsBooked(true);
        triggerNotification(
          'success',
          'Pertemuan Terjadwal',
          `Jadwal Anda bersama ${selectedPeer.name} telah berhasil terdaftar pada ${bookingDate} pukul ${bookingTime}. Detail dan lokasi ruang aman dikirimkan secara pribadi ke email Anda.`
        );
      };

      const handleTicketGeneration = () => {
        triggerNotification(
          'success',
          'Tiket Rujukan Dibuat',
          'Tiket Pengajuan Rujukan Anda berhasil dibuat dengan aman dan terenkripsi. Tim Satgas PPK atau Konselor Profesional UPT Universitas akan menghubungi Anda dalam waktu maksimal 1x24 jam.'
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col transition-colors duration-500">
          
          {}
          {/* NOTIFIKASI KUSTOM MODAL */}
          {customNotification && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#14263C]/40 backdrop-blur-sm transition-opacity duration-300 animate-fadeIn">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100 transform scale-100 transition-all duration-300">
                <div className="flex items-start justify-between">
                  <div className="flex items-center space-x-3">
                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                      customNotification.type === 'success' ? 'bg-aegis-sage/20 text-aegis-sage' :
                      customNotification.type === 'warning' ? 'bg-amber-100 text-amber-700' :
                      'bg-rose-100 text-rose-600'
                    }`}>

                        />
                      </div>

                      <div className="p-4 bg-rose-50/50 rounded-xl border border-rose-100">
                        <p className="text-[10px] text-rose-800 font-bold leading-relaxed">
                          ⚠️ Kerahasiaan Anda dijamin penuh. Informasi ini hanya akan dibagikan kepada spesialis/tim profesional terpilih setelah persetujuan Anda.
                        </p>
                      </div>

                      <button 
                        onClick={handleTicketGeneration}
                        className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-rose-100 transform active:scale-95"
                      >
                        Klaim Tiket Rujukan Sekarang
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {}
            {/* TAB: LANGKAH RECOVERY */}
            {activeTab === 'recovery' && (
              <div className="space-y-8 animate-fadeIn transition-all">
                <div>
                  <span className="bg-teal-100 text-teal-800 text-xs px-3.5 py-1.5 rounded-full font-bold uppercase tracking-wider border border-teal-200">
                    RECOVERY — Pemulihan & Pemberdayaan Mandiri
                  </span>
                  <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight mt-3">Langkah Lanjutan & Komunitas</h2>
                  <p className="text-slate-500 mt-1">Kami mendampingi proses regenerasi mental Anda demi menjamin tidak ada civitas akademika yang dibiarkan pulih sendirian.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  
                  {/* Left Column: Mood Tracker */}
                  <div className="lg:col-span-2 space-y-8">
                    
                    {/* Recovery Check-in */}
                    <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="font-bold text-slate-800 text-base flex items-center gap-1.5">
                          <SvgIcon name="activity" className="w-5 h-5 text-teal-600" /> Recovery Check-In Harian
                        </h3>
                        <span className="text-xs text-slate-400 font-semibold">Diperbarui Berkala</span>
                      </div>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Bagaimana kondisi kebugaran batin dan emosi Anda saat ini? Isi jurnal kilat di bawah untuk memantau grafik pemulihan pribadi Anda.
                      </p>

                      <div className="grid grid-cols-5 gap-3 pt-2">
                        {[
                          { emoji: '😭', label: 'Terguncang', val: 1 },
                          { emoji: '😔', label: 'Cemas/Sedih', val: 2 },
                          { emoji: '😐', label: 'Biasa Saja', val: 3 },
                          { emoji: '🙂', label: 'Cukup Baik', val: 4 },
                          { emoji: '😊', label: 'Sangat Baik', val: 5 },
                        ].map((m) => (
                          <button 
                            key={m.val}
                            onClick={() => {
                              setDailyMood(m.val);
                              triggerNotification(
                                'success', 
                                'Mood Check-In Tercatat', 
                                'Terima kasih telah berbagi dengan diri Anda sendiri hari ini! Grafik pemulihan Anda menunjukkan stabilitas yang baik.'
                              );
                            }}
                            className={`p-3 rounded-2xl border transition-all duration-300 text-center flex flex-col items-center justify-center gap-1 transform active:scale-95 ${
                              dailyMood === m.val 
                                ? 'bg-teal-50 border-teal-500 text-teal-800 font-bold scale-[1.05] shadow-inner' 
                                : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100 hover:border-slate-300'
                            }`}
                          >
                            <span className="text-2xl">{m.emoji}</span>
                            <span className="text-[9px] block leading-none font-bold mt-1">{m.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Resource Center */}
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <SvgIcon name="book-open" className="w-5 h-5 text-aegis-sage" /> Perpustakaan Literasi Mandiri
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {[
                          { title: 'Jurnal Afirmasi Positif untuk Membangun Rasa Percaya Diri', type: 'Self Growth', downloads: 142 },
                          { title: 'Panduan Mengelola Post-Traumatic Stress Disorder (PTSD) Ringan', type: 'Clinical Mental Health', downloads: 98 },
                        ].map((item, idx) => (
                          <div key={idx} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between hover:shadow-md transition-all duration-300 transform hover:scale-[1.01]">
                            <div>
                              <span className="bg-slate-100 text-slate-600 text-[9px] font-bold uppercase px-2 py-0.5 rounded-full border border-slate-200">{item.type}</span>
                              <h4 className="font-bold text-slate-800 text-sm mt-2.5 leading-snug">{item.title}</h4>
                            </div>
                            <div className="mt-4 pt-4 border-t border-slate-50 flex items-center justify-between text-[11px] text-slate-500">
                              <span>📥 {item.downloads} diunduh</span>
                              <span 
                                onClick={() => triggerNotification('success', 'Buku Saku Diunduh', 'Unduhan buku saku dimulai. Selamat membaca!')}
                                className="text-aegis-blue font-bold cursor-pointer hover:underline"
                              >
                                Unduh Buku Saku
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>

                  {}
                  {/* Right Column: Community */}
                  <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm flex flex-col h-[520px] justify-between">
                    <div>
                      <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                        <SvgIcon name="users" className="w-5 h-5 text-aegis-blue" /> Komunitas Aman (Anonim)
                      </h3>
                      <p className="text-xs text-slate-400 mt-1">Dapatkan kekuatan dari kesaksian sesama. Seluruh kiriman diproses secara rahasia dan termoderasi ketat.</p>
                      
                      {/* Share Feed Area */}
                      <div className="mt-4 space-y-3 h-[300px] overflow-y-auto pr-1">
                        {communityPosts.map((post) => (
                          <div key={post.id} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-100 text-[11px] transition-all duration-300">
                            <div className="flex items-center justify-between mb-2">
                              <span className="font-bold text-slate-700">{post.author}</span>
                              <span className="text-slate-400">{post.time}</span>
                            </div>
                            <p className="text-slate-600 leading-relaxed font-light">{post.content}</p>
                            <div className="mt-2.5 flex items-center gap-1 text-slate-400 hover:text-aegis-sage cursor-pointer transition-colors">
                              <SvgIcon name="thumbs-up" className="w-3.5 h-3.5" /> <span className="font-semibold">{post.likes}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Post Input Box */}
                    <div className="pt-4 border-t border-slate-100 text-xs">
                      <textarea 
                        value={newPostText}
                        onChange={(e) => setNewPostText(e.target.value)}
                        rows="2" 
                        placeholder="Tulis pesan penyemangat atau kesaksian anonim Anda..."
                        className="w-full border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-aegis-sage bg-slate-50 font-medium"
                      />
                      <button 
                        onClick={handleAddPost}
                        className="mt-2 w-full bg-aegis-blue hover:bg-aegis-dark text-white font-bold py-3 rounded-xl transition-all transform active:scale-95 shadow-md"
                      >
                        Kirim ke Komunitas (Anonim)
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

          </main>

          {}
          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-150 mt-12 py-10 text-center text-xs text-slate-400">
            <div className="max-w-7xl mx-auto px-4 space-y-3">
              <div className="flex justify-center items-center">
                <AegisLogo className="w-10 h-10 filter grayscale opacity-60" />
              </div>
              <p className="font-extrabold text-aegis-blue uppercase tracking-widest mt-2">
                AEGIS — Kampanye Pengurangan Dampak Perilaku Menyalahkan Korban (Victim Blaming)
              </p>
              <p className="text-slate-400 font-medium">© 2026 AEGIS Project. Menjaga Kesejahteraan Mental & Keamanan Jiwa Akademika Universitas.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
